name: build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "platforms;android-21" "platforms;android-19" "platforms;android-23" "platforms;android-25" "platforms;android-27" "build-tools;36.0.0" "build-tools;35.0.0"
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28
          add-to-path: false
      - name: Build native parts from source
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          python3 native/build_all.py
          cd native/guest64
          for d in [0-9]*; do [ -d "$d" ] && sh build.sh "$d"; done
      - name: Build guest Wi-Fi jar from source
        run: |
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          export D8_JAR="$ANDROID_HOME/build-tools/36.0.0/lib/d8.jar"
          sh app/guest-wifi/build.sh
          ls -l app/src/main/assets/engines/kk/aemu-wifi.jar
          sha256sum app/src/main/assets/engines/kk/aemu-wifi.jar
      - name: Assert guest Wi-Fi jar kept the Gingerbread gate
        run: |
          unzip -p app/src/main/assets/engines/kk/aemu-wifi.jar classes.dex > /tmp/aemu-wifi-classes.dex
          if grep -a -q "left to the framework" /tmp/aemu-wifi-classes.dex; then
            echo "OK: Gingerbread leaveName gate string present in the aemu-wifi dex"
          else
            echo "ERROR: Gingerbread leaveName gate string MISSING from the aemu-wifi dex - D8 min-api pruning ate the SDK_INT < 14 branch again" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aemu-wifi-jar
          path: app/src/main/assets/engines/kk/aemu-wifi.jar
      - name: Build guest GL bridge driver (KK/GB, armv7) from source
        run: |
          python3 -m pip install --quiet "ziglang==0.17.1"
          python3 -m ziglang version
          sh native/glbridge/build32-zig.sh
          ls -l app/src/main/assets/engines/kk/libGLES_aemu.so
          sha256sum app/src/main/assets/engines/kk/libGLES_aemu.so
      - name: Assert guest GL bridge driver is the verified build
        run: |
          if echo "d34282006bd96fc5aeaf95b73b75f63f120d5bf628eeac92172872a2fd1a5f5a  app/src/main/assets/engines/kk/libGLES_aemu.so" | sha256sum -c -; then
            echo "OK: guest GL bridge driver matches the byte-verified build (native/glbridge/guest.c via zig)"
          else
            echo "ERROR: guest GL bridge driver does NOT match the verified build - the glbridge sources changed without re-verification" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aemu-glbridge-kk
          path: app/src/main/assets/engines/kk/libGLES_aemu.so
      - name: Build guest Bluetooth jar from source
        run: |
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-19/android.jar"
          export D8_JAR="$ANDROID_HOME/build-tools/36.0.0/lib/d8.jar"
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          sh app/guest-bt/build.sh
          ls -l app/src/main/assets/engines/kk/aemu-bt.jar
          sha256sum app/src/main/assets/engines/kk/aemu-bt.jar
      - uses: actions/upload-artifact@v4
        with:
          name: aemu-bt-jar
          path: app/src/main/assets/engines/kk/aemu-bt.jar
      - name: Build guest Bluetooth jars (N64, API 23-27) from source
        run: |
          export JAR23="$ANDROID_HOME/platforms/android-23/android.jar"
          export JAR24="$ANDROID_HOME/platforms/android-25/android.jar"
          export JAR26="$ANDROID_HOME/platforms/android-27/android.jar"
          export D8_JAR="$ANDROID_HOME/build-tools/36.0.0/lib/d8.jar"
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          sh app/guest-bt-n64/build.sh
          ls -l app/src/main/assets/engines/kk/aemu-bt23.jar app/src/main/assets/engines/kk/aemu-bt24.jar app/src/main/assets/engines/kk/aemu-bt26.jar
          sha256sum app/src/main/assets/engines/kk/aemu-bt23.jar app/src/main/assets/engines/kk/aemu-bt24.jar app/src/main/assets/engines/kk/aemu-bt26.jar
      - name: Build guest agent jar from source
        run: |
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-19/android.jar"
          export D8_JAR="$ANDROID_HOME/build-tools/36.0.0/lib/d8.jar"
          sh app/guest-agent/build.sh
          ls -l app/src/main/assets/engines/kk/aemu-agent.jar
          sha256sum app/src/main/assets/engines/kk/aemu-agent.jar
      - uses: actions/upload-artifact@v4
        with:
          name: aemu-agent-jar
          path: app/src/main/assets/engines/kk/aemu-agent.jar
      - name: Build guest agent inbox app from source
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          sh app/guest-agent-app/build.sh
          ls -l app/src/main/assets/engines/kk/aemu-agent.apk
          sha256sum app/src/main/assets/engines/kk/aemu-agent.apk
      - uses: actions/upload-artifact@v4
        with:
          name: aemu-agent-apk
          path: app/src/main/assets/engines/kk/aemu-agent.apk
      - name: Build guest superuser stack from source
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          sh app/guest-superuser/build.sh
          ls -l app/src/main/assets/engines/kk/aemu-su app/src/main/assets/engines/kk/aemu-superuser.apk
          sha256sum app/src/main/assets/engines/kk/aemu-su app/src/main/assets/engines/kk/aemu-superuser.apk
      - uses: actions/upload-artifact@v4
        with:
          name: aemu-superuser-assets
          path: |
            app/src/main/assets/engines/kk/aemu-su
            app/src/main/assets/engines/kk/aemu-superuser.apk
      - name: Build guest Magisk substitute stack
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          AEMU_KEYSTORE_B64: ${{ secrets.AEMU_KEYSTORE_B64 }}
          AEMU_KEYSTORE_PASSWORD: ${{ secrets.AEMU_KEYSTORE_PASSWORD }}
        run: |
          echo "$AEMU_KEYSTORE_B64" | base64 -d > /tmp/aemulator.p12
          export AEMU_KEYSTORE_FILE=/tmp/aemulator.p12
          sh app/guest-substitute/build.sh
          ls -l app/src/main/assets/engines/kk/aemu-magisk-sub.apk
          sha256sum app/src/main/assets/engines/kk/aemu-magisk-sub.apk
      - uses: actions/upload-artifact@v4
        with:
          name: aemu-magisk-sub-apk
          path: app/src/main/assets/engines/kk/aemu-magisk-sub.apk
      - name: Build guest Zygisk spike stack
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          sh app/guest-zygisk/build.sh
          sha256sum app/src/main/assets/engines/kk/aemu-azygisk.so app/src/main/assets/engines/kk/aemu-zygisk-testmod.so
      - uses: actions/upload-artifact@v4
        with:
          name: aemu-zygisk-assets
          path: |
            app/src/main/assets/engines/kk/aemu-azygisk.so
            app/src/main/assets/engines/kk/aemu-zygisk-testmod.so
      - name: Build guest terminal app from source
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          sh app/guest-terminal/build.sh
          ls -l app/src/main/assets/engines/kk/aemu-terminal.apk
          sha256sum app/src/main/assets/engines/kk/aemu-terminal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: aemu-terminal-apk
          path: app/src/main/assets/engines/kk/aemu-terminal.apk
      - name: Build APK
        run: |
          chmod +x gradlew
          sed -i "s|^org.gradle.java.home=.*|org.gradle.java.home=$JAVA_HOME|" gradle.properties
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: aemulator-apk
          path: app/build/outputs/apk/*/release/*.apk
      - name: Sign APKs
        env:
          AEMU_KEYSTORE_B64: ${{ secrets.AEMU_KEYSTORE_B64 }}
          AEMU_KEYSTORE_PASSWORD: ${{ secrets.AEMU_KEYSTORE_PASSWORD }}
        run: |
          echo "$AEMU_KEYSTORE_B64" | base64 -d > /tmp/aemulator.p12
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "build-tools: $BT"
          for f in app/build/outputs/apk/*/release/*-unsigned.apk; do
            out="${f%-unsigned.apk}-signed.apk"
            "${BT}apksigner" sign --ks /tmp/aemulator.p12 --ks-type PKCS12 --ks-key-alias aemulator --ks-pass pass:"$AEMU_KEYSTORE_PASSWORD" --key-pass pass:"$AEMU_KEYSTORE_PASSWORD" --out "$out" "$f"
            "${BT}apksigner" verify --print-certs "$out" | head -4
          done
      - name: Stage the installable signed APK
        run: |
          mkdir -p signed-out
          src="app/build/outputs/apk/standard/release/app-standard-release-signed.apk"
          test -s "$src"
          cp "$src" signed-out/AEmulator.apk
          ls -l signed-out
      - uses: actions/upload-artifact@v4
        with:
          name: aemulator-apk-signed
          path: signed-out/AEmulator.apk
